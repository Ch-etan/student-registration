
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect | Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            background: linear-gradient(135deg, #101b35, #344b91, #7665d8);
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .brand {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .brand-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .brand h1 {
            font-size: 30px;
            letter-spacing: 1px;
        }

        .brand p {
            color: #d8e0ff;
            margin-top: 6px;
        }

        .form-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.25);
        }

        .form-card h2 {
            color: #172554;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #273451;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d9e0ec;
            border-radius: 10px;
            background: #f8faff;
            color: #172554;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: #6558dc;
            box-shadow: 0 0 0 3px rgba(101, 88, 220, 0.13);
        }

        input::placeholder {
            color: #9aa6bb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #6255df, #8371f5);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(98, 85, 223, 0.3);
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            background: #dcfce7;
            color: #166534;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #d8e0ff;
            font-size: 12px;
            margin-top: 22px;
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="brand">
            <div class="brand-icon">🎓</div>
            <h1>EduConnect</h1>
            <p>Student Registration Portal</p>
        </header>

        <section class="form-card">
            <h2>Create Your Account</h2>
            <p class="subtitle">
                Fill in your details to begin your academic journey.
            </p>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName"
                           name="studentName"
                           placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber"
                           name="rollNumber"
                           placeholder="e.g. STU2026001" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           name="email"
                           placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="course">Select Your Course</label>
                    <select id="course" name="course" required>
                        <option value="">Choose a course</option>
                        <option value="BCA">BCA - Computer Applications</option>
                        <option value="BTech">B.Tech - Engineering</option>
                        <option value="MCA">MCA - Computer Applications</option>
                        <option value="MBA">MBA - Business Administration</option>
                        <option value="BSc">B.Sc - Science</option>
                    </select>
                </div>

                <button type="submit">Register Now →</button>

                <div class="message" id="successMessage" role="status">
                    Registration form validated successfully!
                </div>
            </form>
        </section>

        <footer class="footer">
            © 2026 EduConnect | Student Portal
        </footer>
    </main>

    <script>
        document.getElementById("registrationForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("successMessage")
                    .style.display = "block";
            });
    </script>
</body>
</html>
